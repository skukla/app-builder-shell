# Runs only checks that need no credentials, and nothing that deploys.
# The repo has no lockfile and no dependencies yet, so this uses npm install
# (not npm ci) and no npm cache. Switch to npm ci + cache once a lockfile exists.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the action runtime (nodejs:22) in app.config.yaml.
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax-check JavaScript
        run: |
          files=$(git ls-files '*.js' '*.cjs' '*.mjs')
          test -n "$files"
          for f in $files; do node --check "$f"; done
